
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Budget Tracker</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Website Header -->
    <header class="main-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main class="container">

        <!-- Add Expense Section -->
        <section id="add-expense" class="card">

            <h2>Add Expense</h2>

            <form id="expense-form">

                <label for="expense-name">Expense Name</label>
                <input
                    type="text"
                    id="expense-name"
                    placeholder="Enter expense name"
                    required
                >

                <label for="expense-amount">Amount (KSh)</label>
                <input
                    type="number"
                    id="expense-amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="expense-category">Category</label>
                <input
                    type="text"
                    id="expense-category"
                    placeholder="Enter category"
                    required
                >

                <button type="submit" id="add-expense-btn">
                    Add Expense
                </button>

            </form>

        </section>

        <!-- Your Expenses Section -->
        <section id="your-expenses" class="card">

            <h2>Your Expenses</h2>

            <p id="empty-message">No expenses yet.</p>

            <ul id="expense-list"></ul>

        </section>

    </main>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
